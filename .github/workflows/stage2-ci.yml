name: Stage 2 smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verilator-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++

      - name: Instruction benchmark smoke test
        run: make -C verif sim TEST_DIR=insn-bmarks TEST=rv32ui-p-add VERILATOR="verilator -Wno-fatal"

      - name: Sample benchmark smoke test
        run: make -C verif sim TEST_DIR=sample-bmarks TEST=test1 VERILATOR="verilator -Wno-fatal"

      - name: Control pipeline testbench
        run: make -C verif tb-control_pipeline_tb VERILATOR="verilator -Wno-fatal"

      - name: Hazard and forwarding testbench
        run: make -C verif tb-hazard_forwarding_stall_tb VERILATOR="verilator -Wno-fatal"

      - name: RV32M divider testbench
        run: make -C verif tb-div_rem_unit_tb VERILATOR="verilator -Wno-fatal"

      - name: RV32M iterative multiplier testbench
        run: make -C verif tb-mul_iter_tb VERILATOR="verilator -Wno-fatal"

      - name: RV32M decode and control testbench
        run: make -C verif tb-m_control_tb VERILATOR="verilator -Wno-fatal"

      - name: RV32M pipeline programs
        run: |
          make -C verif sim TEST_DIR=m-pipeline_tests VERILATOR="verilator -Wno-fatal" | tee m-pipeline.log
          expected=$(ls verif/tests/m-pipeline_tests/*.x | wc -l)
          passed=$(grep -c "Test Passed" m-pipeline.log || true)
          echo "RV32M pipeline programs passed: $passed / $expected"
          test "$passed" -eq "$expected"
